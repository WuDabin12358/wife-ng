name: Build and offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/wrapper-validation@v6.4.0
      - run: python scripts/fetch_dependencies.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: chmod +x gradlew && ./gradlew build architectureChecks --no-daemon
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wife-ng-jars
          path: build/libs/*.jar
